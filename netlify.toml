[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ═══════════════════════════════════════════════════════════════════════
# ⚠️ STAGING-SCHUTZ — VOR DEM LIVEGANG AUF djbruma.de ENTFERNEN! ⚠️
# Verhindert, dass die Vorschau-Domain (djbruma-v2.netlify.app) von Google
# indexiert wird und als Duplicate Content mit djbruma.de konkurriert.
# Bleibt dieser Block beim Prod-Deploy bestehen, wird die Seite DEINDEXIERT.
# ═══════════════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Alte Location-URLs (.html) → neue Struktur, damit bestehendes Ranking erhalten bleibt
[[redirects]]
  from = "/hochzeits-dj-bremen.html"
  to = "/hochzeits-dj/bremen"
  status = 301
[[redirects]]
  from = "/hochzeits-dj-frankfurt.html"
  to = "/hochzeits-dj/frankfurt"
  status = 301
[[redirects]]
  from = "/hochzeits-dj-mainz.html"
  to = "/hochzeits-dj/mainz"
  status = 301
[[redirects]]
  from = "/hochzeits-dj-wiesbaden.html"
  to = "/hochzeits-dj/wiesbaden"
  status = 301
