[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless-Funktionen (aus der v1 übernommen):
#   availability.cjs        – liest den iCloud-"Belegt"-Kalender für den Verfügbarkeitskalender
#   submission-created.cjs  – schickt nach jeder Formular-Einsendung die Auto-Mails über Resend
# submission-created braucht die Umgebungsvariablen RESEND_API_KEY, MAIL_FROM und MAIL_OWNER.
# Fehlen sie, tut die Funktion nichts und das Formular läuft trotzdem.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# noindex-Staging-Schutz entfernt (28.07.2026): dieser Stand ist für den Livegang
# auf djbruma.de bestimmt. ⚠️ NICHT mehr auf die Staging-Site (djbruma-v2.netlify.app)
# deployen — sie wäre sonst indexierbar und konkurriert als Duplicate Content mit
# der Hauptdomain. Staging nach dem Livegang stilllegen oder pausieren.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Alte Location-URLs (.html) → neue Struktur, damit bestehendes Ranking erhalten bleibt
[[redirects]]
  from = "/hochzeits-dj-bremen.html"
  to = "/hochzeits-dj/bremen"
  status = 301
[[redirects]]
  from = "/hochzeits-dj-frankfurt.html"
  to = "/hochzeits-dj/frankfurt"
  status = 301
[[redirects]]
  from = "/hochzeits-dj-mainz.html"
  to = "/hochzeits-dj/mainz"
  status = 301
[[redirects]]
  from = "/hochzeits-dj-wiesbaden.html"
  to = "/hochzeits-dj/wiesbaden"
  status = 301
